name: Generate Capacitor Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    # Permite usar secrets cadastrados no Environment "production".
    # Secrets do repositório continuam disponíveis normalmente.
    environment: production
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TORVGYM_VERSION_CODE: ${{ github.run_number }}
      TORVGYM_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate project
        run: npm run typecheck && npm test && npm run lint

      - name: Build web assets for Capacitor
        run: npm run build:capacitor

      - name: Create Android platform if needed
        run: |
          if [ -d android ]; then
            echo "A plataforma Android já existe; pulando cap add android."
          else
            npm run cap:add:android
          fi

      - name: Sync Capacitor Android
        run: npm run cap:sync

      - name: Validate Android security resources
        run: |
          test -f android/app/src/main/res/xml/backup_rules.xml
          test -f android/app/src/main/res/xml/data_extraction_rules.xml
          ! test -f android/app/src/main/res/xml/file_paths.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:fullBackupContent="@xml/backup_rules"' android/app/src/main/AndroidManifest.xml

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: torvgym-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Validate production signing secrets
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          HAS_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          missing=0

          if [ "$HAS_ANDROID_KEYSTORE_BASE64" != "true" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 está ausente ou vazio."
            missing=1
          fi
          if [ "$HAS_ANDROID_KEYSTORE_PASSWORD" != "true" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_PASSWORD está ausente ou vazio."
            missing=1
          fi
          if [ "$HAS_ANDROID_KEY_ALIAS" != "true" ]; then
            echo "::error::Secret ANDROID_KEY_ALIAS está ausente ou vazio."
            missing=1
          fi
          if [ "$HAS_ANDROID_KEY_PASSWORD" != "true" ]; then
            echo "::error::Secret ANDROID_KEY_PASSWORD está ausente ou vazio."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::Configure os quatro secrets de assinatura no repositório antes de executar o workflow manual."
            exit 1
          fi

          echo "Os quatro secrets de assinatura estão disponíveis."

      - name: Prepare production keystore
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/torvgym-release.jks"
          test -s "$RUNNER_TEMP/torvgym-release.jks"

      - name: Validate production keystore
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$RUNNER_TEMP/torvgym-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -v > "$RUNNER_TEMP/torvgym-keytool.txt"
          grep -q "Entry type: PrivateKeyEntry" "$RUNNER_TEMP/torvgym-keytool.txt"
          rm -f "$RUNNER_TEMP/torvgym-keytool.txt"

          rm -f "$RUNNER_TEMP/torvgym-key-validation.jks"
          keytool -importkeystore \
            -srckeystore "$RUNNER_TEMP/torvgym-release.jks" \
            -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -srckeypass "$ANDROID_KEY_PASSWORD" \
            -destkeystore "$RUNNER_TEMP/torvgym-key-validation.jks" \
            -deststoretype PKCS12 \
            -deststorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -destkeypass "$ANDROID_KEYSTORE_PASSWORD" \
            -noprompt >/dev/null
          rm -f "$RUNNER_TEMP/torvgym-key-validation.jks"
          echo "Keystore, alias e senha da chave foram validados."

      - name: Capture production certificate fingerprint
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list -v \
            -keystore "$RUNNER_TEMP/torvgym-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" |
            awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':[:space:]\r\n' | tr '[:lower:]' '[:upper:]' > "$RUNNER_TEMP/torvgym-keystore-sha256.txt"
          test -s "$RUNNER_TEMP/torvgym-keystore-sha256.txt"
          test "$(wc -c < "$RUNNER_TEMP/torvgym-keystore-sha256.txt")" -eq 64
          echo "Fingerprint SHA-256 do certificado do keystore capturado e normalizado."

      - name: Build signed Android release APK and AAB
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/torvgym-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease bundleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Verify signed APK and AAB
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        working-directory: android
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          set +e
          "$APKSIGNER" verify --min-sdk-version 24 --verbose "$APK" > "$RUNNER_TEMP/torvgym-apk-verify.txt" 2>&1
          apksigner_status=$?
          set -e
          cat "$RUNNER_TEMP/torvgym-apk-verify.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/torvgym-apk-verify.txt"
          grep -q "Number of signers: 1" "$RUNNER_TEMP/torvgym-apk-verify.txt"
          if grep -qiE "does not verify|failed to verify|verification failed|no signers" "$RUNNER_TEMP/torvgym-apk-verify.txt"; then
            echo "::error::apksigner reportou uma falha explícita de verificação do APK."
            exit 1
          fi
          if [ "$apksigner_status" -ne 0 ]; then
            echo "::warning::apksigner retornou $apksigner_status, mas a verificação V2 obrigatória foi confirmada."
          fi

          set +e
          "$APKSIGNER" verify --min-sdk-version 24 --print-certs "$APK" > "$RUNNER_TEMP/torvgym-apk-certs.txt" 2>&1
          print_certs_status=$?
          set -e
          cat "$RUNNER_TEMP/torvgym-apk-certs.txt"
          grep -E "Signer #1 certificate SHA-256 digest:" "$RUNNER_TEMP/torvgym-apk-certs.txt" | sed 's/.*: //' | tr -d ':[:space:]\r\n' | tr '[:lower:]' '[:upper:]' > "$RUNNER_TEMP/torvgym-apk-sha256.txt"
          test -s "$RUNNER_TEMP/torvgym-apk-sha256.txt"
          test "$(wc -c < "$RUNNER_TEMP/torvgym-apk-sha256.txt")" -eq 64
          if [ "$print_certs_status" -ne 0 ]; then
            echo "::warning::apksigner --print-certs retornou $print_certs_status, mas o certificado foi extraído e será comparado ao keystore."
          fi

          # O AAB é um ZIP assinado no formato JAR. O unzip valida a
          # integridade física do arquivo e o jarsigner valida a assinatura
          # criptográfica e os digests das entradas.
          test -s "$AAB"
          unzip -tq "$AAB"
          set +e
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/torvgym-aab-verify.txt" 2>&1
          jarsigner_status=$?
          set -e
          cat "$RUNNER_TEMP/torvgym-aab-verify.txt"
          if [ "$jarsigner_status" -ne 0 ]; then
            echo "::error::jarsigner confirmou falha real na assinatura ou integridade do AAB (status $jarsigner_status)."
            exit "$jarsigner_status"
          fi
          keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/torvgym-aab-certs.txt"
          cat "$RUNNER_TEMP/torvgym-aab-certs.txt"
          awk -F': ' '/SHA256:/{print $2; exit}' "$RUNNER_TEMP/torvgym-aab-certs.txt" | tr -d ':[:space:]\r\n' | tr '[:lower:]' '[:upper:]' > "$RUNNER_TEMP/torvgym-aab-sha256.txt"
          test -s "$RUNNER_TEMP/torvgym-aab-sha256.txt"
          test "$(wc -c < "$RUNNER_TEMP/torvgym-aab-sha256.txt")" -eq 64

          tr -d ':[:space:]\r\n' < "$RUNNER_TEMP/torvgym-keystore-sha256.txt" | tr '[:lower:]' '[:upper:]' > "$RUNNER_TEMP/keystore.sha"
          tr -d ':[:space:]\r\n' < "$RUNNER_TEMP/torvgym-apk-sha256.txt" | tr '[:lower:]' '[:upper:]' > "$RUNNER_TEMP/apk.sha"
          tr -d ':[:space:]\r\n' < "$RUNNER_TEMP/torvgym-aab-sha256.txt" | tr '[:lower:]' '[:upper:]' > "$RUNNER_TEMP/aab.sha"
          test "$(cat "$RUNNER_TEMP/keystore.sha")" = "$(cat "$RUNNER_TEMP/apk.sha")"
          test "$(cat "$RUNNER_TEMP/keystore.sha")" = "$(cat "$RUNNER_TEMP/aab.sha")"

          echo "APK assinado e certificado correspondem ao certificado do keystore."
          echo "AAB íntegro e certificado de assinatura corresponde ao certificado do keystore."
          rm -f "$RUNNER_TEMP/torvgym-keystore-sha256.txt" "$RUNNER_TEMP/torvgym-apk-sha256.txt" "$RUNNER_TEMP/torvgym-apk-certs.txt" "$RUNNER_TEMP/torvgym-apk-verify.txt" "$RUNNER_TEMP/torvgym-aab-verify.txt" "$RUNNER_TEMP/torvgym-aab-certs.txt" "$RUNNER_TEMP/torvgym-aab-sha256.txt" "$RUNNER_TEMP/keystore.sha" "$RUNNER_TEMP/apk.sha" "$RUNNER_TEMP/aab.sha"
      - name: Upload signed Android release APK
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: torvgym-release-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Android App Bundle
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: torvgym-release-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14


      - name: Commit Android platform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android package-lock.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nativa nova para commit."
            exit 0
          fi
          git commit -m "chore: generate Capacitor Android platform [skip ci]"
          git push

  publish-release:
    if: ${{ github.event_name == 'push' }}
    needs: android
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v5.0.0

      - name: Download signed Android release APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: torvgym-release-signed-apk
          path: release-assets

      - name: Download signed Android App Bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: torvgym-release-signed-aab
          path: release-assets

      - name: Publish automatic GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          APK="release-assets/app-release.apk"
          AAB="release-assets/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$AAB" --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "TorvGym $TAG" --generate-notes "$APK" "$AAB"
          fi
          echo "Release automática publicada: $TAG"


  publish-update-channel:
    needs:
      - android
      - publish-release
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Validate Pages deployment job
        run: echo "Pages deployment job loaded successfully."
