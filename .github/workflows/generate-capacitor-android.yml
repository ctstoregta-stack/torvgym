name: Generate Capacitor Android

on:
  push:
    branches:
      - main
    paths-ignore:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    # Permite usar secrets cadastrados no Environment "production".
    # Secrets do repositório continuam disponíveis normalmente.
    environment: production
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate project
        run: npm run typecheck && npm test

      - name: Build web assets for Capacitor
        run: npm run build:capacitor

      - name: Create Android platform if needed
        run: |
          if [ -d android ]; then
            echo "A plataforma Android já existe; pulando cap add android."
          else
            npm run cap:add:android
          fi

      - name: Sync Capacitor Android
        run: npm run cap:sync

      - name: Validate Android security resources
        run: |
          test -f android/app/src/main/res/xml/backup_rules.xml
          test -f android/app/src/main/res/xml/data_extraction_rules.xml
          ! test -f android/app/src/main/res/xml/file_paths.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:fullBackupContent="@xml/backup_rules"' android/app/src/main/AndroidManifest.xml

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: torvgym-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Android release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload Android release APK (unsigned)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: torvgym-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Validate production signing secrets
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          HAS_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          missing=0

          if [ "$HAS_ANDROID_KEYSTORE_BASE64" != "true" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 está ausente ou vazio."
            missing=1
          fi
          if [ "$HAS_ANDROID_KEYSTORE_PASSWORD" != "true" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_PASSWORD está ausente ou vazio."
            missing=1
          fi
          if [ "$HAS_ANDROID_KEY_ALIAS" != "true" ]; then
            echo "::error::Secret ANDROID_KEY_ALIAS está ausente ou vazio."
            missing=1
          fi
          if [ "$HAS_ANDROID_KEY_PASSWORD" != "true" ]; then
            echo "::error::Secret ANDROID_KEY_PASSWORD está ausente ou vazio."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::Configure os quatro secrets de assinatura no repositório antes de executar o workflow manual."
            exit 1
          fi

          echo "Os quatro secrets de assinatura estão disponíveis."

      - name: Prepare production keystore
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/torvgym-release.jks"
          test -s "$RUNNER_TEMP/torvgym-release.jks"

      - name: Validate production keystore
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$RUNNER_TEMP/torvgym-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -v > "$RUNNER_TEMP/torvgym-keytool.txt"
          grep -q "Entry type: PrivateKeyEntry" "$RUNNER_TEMP/torvgym-keytool.txt"
          rm -f "$RUNNER_TEMP/torvgym-keytool.txt"

          rm -f "$RUNNER_TEMP/torvgym-key-validation.jks"
          keytool -importkeystore \
            -srckeystore "$RUNNER_TEMP/torvgym-release.jks" \
            -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -srckeypass "$ANDROID_KEY_PASSWORD" \
            -destkeystore "$RUNNER_TEMP/torvgym-key-validation.jks" \
            -deststoretype PKCS12 \
            -deststorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -destkeypass "$ANDROID_KEYSTORE_PASSWORD" \
            -noprompt >/dev/null
          rm -f "$RUNNER_TEMP/torvgym-key-validation.jks"
          echo "Keystore, alias e senha da chave foram validados."

      - name: Capture production certificate fingerprint
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list -v \
            -keystore "$RUNNER_TEMP/torvgym-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" |
            awk -F': ' '/SHA256:/{print $2; exit}' > "$RUNNER_TEMP/torvgym-keystore-sha256.txt"
          test -s "$RUNNER_TEMP/torvgym-keystore-sha256.txt"
          echo "Fingerprint SHA-256 do certificado do keystore capturado para comparação."

      - name: Build signed Android release APK and AAB
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/torvgym-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease bundleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Verify signed APK and AAB
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: android
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          set +e
          "$APKSIGNER" verify --min-sdk-version 24 --verbose "$APK" > "$RUNNER_TEMP/torvgym-apk-verify.txt" 2>&1
          apksigner_status=$?
          set -e
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/torvgym-apk-verify.txt"
          if [ "$apksigner_status" -ne 0 ]; then
            echo "apksigner retornou $apksigner_status, mas a assinatura V2 obrigatória foi validada."
          fi
          set +e
          "$APKSIGNER" verify --min-sdk-version 24 --print-certs "$APK" > "$RUNNER_TEMP/torvgym-apk-certs.txt" 2>&1
          print_certs_status=$?
          set -e
          grep -E "Signer #1 certificate SHA-256 digest:" "$RUNNER_TEMP/torvgym-apk-certs.txt" | sed 's/.*: //' | tr -d '\r\n' > "$RUNNER_TEMP/torvgym-apk-sha256.txt"
          test -s "$RUNNER_TEMP/torvgym-apk-sha256.txt"
          if [ "$print_certs_status" -ne 0 ]; then
            echo "apksigner --print-certs retornou $print_certs_status, mas o certificado do APK foi extraído para validação."
          fi

          jarsigner_status=0
          set +e
          jarsigner -verify -strict "$AAB" >/dev/null
          jarsigner_status=$?
          set -e
          if [ "$jarsigner_status" -ne 0 ]; then
            echo "::error::O AAB falhou na verificação JAR (status $jarsigner_status)."
            exit "$jarsigner_status"
          fi

          tr -d '\r\n' < "$RUNNER_TEMP/torvgym-keystore-sha256.txt" | tr '[:lower:]' '[:upper:]' > "$RUNNER_TEMP/keystore.sha"
          tr -d '\r\n' < "$RUNNER_TEMP/torvgym-apk-sha256.txt" | tr '[:lower:]' '[:upper:]' > "$RUNNER_TEMP/apk.sha"
          test "$(cat "$RUNNER_TEMP/keystore.sha")" = "$(cat "$RUNNER_TEMP/apk.sha")"

          echo "APK assinado e certificado correspondem ao certificado do keystore."
          echo "AAB também passou na verificação JAR."
          rm -f "$RUNNER_TEMP/torvgym-keystore-sha256.txt" "$RUNNER_TEMP/torvgym-apk-sha256.txt" "$RUNNER_TEMP/torvgym-apk-certs.txt" "$RUNNER_TEMP/keystore.sha" "$RUNNER_TEMP/apk.sha"
      - name: Upload signed Android release APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: torvgym-release-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Android App Bundle
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: torvgym-release-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Commit Android platform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android package-lock.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nativa nova para commit."
            exit 0
          fi
          git commit -m "chore: generate Capacitor Android platform [skip ci]"
          git push
