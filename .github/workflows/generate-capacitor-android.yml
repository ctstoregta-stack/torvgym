name: Generate Capacitor Android

on:
  push:
    branches:
      - main
    paths-ignore:
      - "android/**"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Validate project
        run: npm run typecheck && npm test

      - name: Build web assets for Capacitor
        run: npm run build:capacitor

      - name: Create Android platform
        run: npm run cap:add:android

      - name: Sync Capacitor Android
        run: npm run cap:sync

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Commit Android platform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android package-lock.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nativa nova para commit."
            exit 0
          fi
          git commit -m "chore: generate Capacitor Android platform [skip ci]"
          git push
