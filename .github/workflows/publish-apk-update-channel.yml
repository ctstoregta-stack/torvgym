name: Publish TorvGym APK update channel

on:
  workflow_run:
    workflows:
      - Generate Capacitor Android
    types:
      - completed

permissions:
  contents: read

jobs:
  publish-update-channel:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Download signed Android release APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: torvgym-release-signed-apk
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare public update channel
        env:
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          TAG="v1.0.$RUN_NUMBER"
          APK="release-assets/app-release.apk"
          UPDATE_DIR="$RUNNER_TEMP/torvgym-pages"
          test -s "$APK"
          mkdir -p "$UPDATE_DIR/releases/$TAG"
          cp "$APK" "$UPDATE_DIR/releases/$TAG/torvgym-release.apk"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE_BYTES="$(stat -c '%s' "$APK")"
          cat > "$UPDATE_DIR/manifest.json" <<EOF
{
  "schemaVersion": 1,
  "tag": "$TAG",
  "versionCode": $RUN_NUMBER,
  "versionName": "1.0.$RUN_NUMBER",
  "apkUrl": "https://ctstoregta-stack.github.io/torvgym/releases/$TAG/torvgym-release.apk",
  "sha256": "$SHA256",
  "sizeBytes": $SIZE_BYTES
}
EOF
          cat "$UPDATE_DIR/manifest.json"

      - name: Upload public update channel
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/torvgym-pages

      - name: Deploy public update channel
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify public update channel and release
        env:
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.$RUN_NUMBER"
          MANIFEST_URL="https://ctstoregta-stack.github.io/torvgym/manifest.json"
          APK_URL="https://ctstoregta-stack.github.io/torvgym/releases/$TAG/torvgym-release.apk"

          curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-all-errors "$MANIFEST_URL" -o "$RUNNER_TEMP/manifest.json"
          python - "$RUNNER_TEMP/manifest.json" "$TAG" "$APK_URL" "$RUN_NUMBER" <<'PY'
import json
import sys
from pathlib import Path
manifest=json.loads(Path(sys.argv[1]).read_text())
expected_tag=sys.argv[2]
expected_url=sys.argv[3]
expected_code=int(sys.argv[4])
required=("schemaVersion","tag","versionCode","versionName","apkUrl","sha256","sizeBytes")
missing=[key for key in required if key not in manifest]
if missing:
    raise SystemExit(f"manifest.json missing fields: {', '.join(missing)}")
if manifest["schemaVersion"] != 1:
    raise SystemExit("manifest schemaVersion is invalid")
if manifest["tag"] != expected_tag or manifest["apkUrl"] != expected_url:
    raise SystemExit("manifest points to an unexpected update target")
if manifest["versionCode"] != expected_code or manifest["versionName"] != f"1.0.{expected_code}":
    raise SystemExit("manifest version does not match workflow run")
if not isinstance(manifest["sha256"], str) or len(manifest["sha256"]) != 64:
    raise SystemExit("manifest sha256 is invalid")
if not isinstance(manifest["sizeBytes"], int) or manifest["sizeBytes"] <= 0:
    raise SystemExit("manifest sizeBytes is invalid")
PY

          curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-all-errors "$APK_URL" -o "$RUNNER_TEMP/public-release.apk"
          test -s "$RUNNER_TEMP/public-release.apk"

          EXPECTED_SHA="$(python - "$RUNNER_TEMP/manifest.json" <<'PY'
import json,sys
print(json.load(open(sys.argv[1]))["sha256"].lower())
PY
)"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/public-release.apk" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          EXPECTED_SIZE="$(python - "$RUNNER_TEMP/manifest.json" <<'PY'
import json,sys
print(json.load(open(sys.argv[1]))["sizeBytes"])
PY
)"
          ACTUAL_SIZE="$(stat -c '%s' "$RUNNER_TEMP/public-release.apk")"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"

          gh release view "$TAG" --json isDraft,isPrerelease,assets --jq 'if .isDraft or .isPrerelease then error("Release não está publicada como estável") else . end'
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'app-release.apk'
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'app-release.aab'

          echo "Canal automático validado: manifest, APK, tamanho, SHA-256 e Release correspondem."
